# air config for live-rebuilding the Go server in development.
# https://github.com/air-verse/air
#
# In dev, air rebuilds ONLY the Go API (no SPA build) and serves on :25634.
# The global Caddy routes ecv3.localhost /api/* here; Ember's own dev server
# serves the SPA at /, so the embedded server/web/dist is irrelevant in dev
# (and excluded below).
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/ec ./cmd/ec"
  bin = "tmp/ec"
  full_bin = "PORT=25634 ./tmp/ec"
  include_ext = ["go"]
  exclude_dir = ["tmp", "client", "server/web/dist"]
  exclude_regex = ["_test\\.go"]
  delay = 500
  stop_on_error = true
  send_interrupt = true

[log]
  time = true

[misc]
  clean_on_exit = true
